name: Check Fuwari site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
      - name: Build official Fuwari with KorClassIC content
        env:
          SITE_URL: https://korclassic.pma.kr
          BASE_PATH: /
        run: bash scripts/materialize-fuwari.sh
