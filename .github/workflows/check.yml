name: Check site

on:
  pull_request:
  push:
    branches:
      - feat/astro-fuwari-archive

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check and build
        run: npm run build
